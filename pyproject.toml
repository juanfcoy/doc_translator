[project]
name = "doc-translator"
version = "0.1.0"
requires-python = ">=3.11"

# ── Black (formatter) ─────────────────────────────────────────────────────────

[tool.black]
line-length = 100
target-version = ["py311"]

# ── Ruff (linter + import sorter) ─────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line length — enforced by black instead
]

[tool.ruff.lint.isort]
known-first-party = ["db", "translator"]

# ── Mypy (type checker) ───────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ── Coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "*/site-packages/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]
