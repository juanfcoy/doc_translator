name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # ── Formatting ─────────────────────────────────────────────────────────
      - name: Check formatting (black)
        run: black --check .

      # ── Linting ────────────────────────────────────────────────────────────
      - name: Lint (ruff)
        run: ruff check .

      # ── Type checking ──────────────────────────────────────────────────────
      - name: Type check (mypy)
        run: mypy app.py db.py translator.py

      # ── Tests + coverage ───────────────────────────────────────────────────
      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=80
        env:
          # Tests mock the API — a placeholder key prevents startup KeyErrors
          ANTHROPIC_API_KEY: test-placeholder-key-for-ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 7
